
name: Update GitHub Stars

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count starred repositories
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const repos = await github.paginate(
              github.rest.activity.listReposStarredByUser,
              {
                username: 'Brookxenos',
                per_page: 100
              }
            );

            const fs = require('fs');

            const data = {
              schemaVersion: 1,
              label: "STARS",
              message: String(repos.length),
              color: "yellow"
            };

            fs.writeFileSync(
              'stars.json',
              JSON.stringify(data, null, 2)
            );

            console.log(`Total starred repositories: ${repos.length}`);

      - name: Save updated count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stars.json
          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub stars count"
            git push
          fi
